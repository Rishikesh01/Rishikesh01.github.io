<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}Rishikesh Sripad Betigeri — Site Reliability Engineer{{ else }}{{ .Title }} · Rishikesh Betigeri{{ end }}</title>
  <meta name="description" content="{{ or .Description site.Params.description }}">
  <meta property="og:title" content="{{ if .IsHome }}Rishikesh Sripad Betigeri — Site Reliability Engineer{{ else }}{{ .Title }}{{ end }}">
  <meta property="og:description" content="{{ or .Description site.Params.description }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <link rel="canonical" href="{{ .Permalink }}">
  {{ with .OutputFormats.Get "rss" -}}
  <link rel="alternate" type="application/rss+xml" title="Rishikesh Betigeri — Blog" href="{{ .Permalink }}">
  {{ end -}}
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='1' stop-color='%23a78bfa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='url(%23g)'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='15' font-weight='700' fill='%230a0b10' text-anchor='middle'%3ERB%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <meta name="theme-color" content="#0a0b10" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#fafbfd" media="(prefers-color-scheme: light)">
  <script>
    // Apply saved theme before first paint to avoid a flash
    (function () {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>

  <header class="site-header">
    <nav class="container nav">
      <a class="nav-name" href="/">RB<span class="nav-dot">.</span></a>
      <div class="nav-links">
        <a href="/#experience">Experience</a>
        <a href="/#projects">Projects</a>
        <a class="nav-cta{{ if eq .Section "blog" }} nav-active{{ end }}" href="/blog/">Blog</a>
        <button id="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
          <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </nav>
  </header>

  <main id="top">
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> Rishikesh Sripad Betigeri · Built with Hugo, plain CSS, and no frameworks</p>
    </div>
  </footer>

  <script src="/js/script.js"></script>
</body>
</html>
